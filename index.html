<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f2f2f8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f0f14" media="(prefers-color-scheme: dark)">
    <meta name="description" content="A mobile-first PWA for reading guitar song tabs">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/icon.png">
    <title>Guitar Tabs</title>
</head>

<body>
    <div class="app-shell">
        <header class="topbar">
            <div>
                <h1>
                    <a href="/">Guitar Tabs</a>
                </h1>
                <div id="offline-indicator" class="offline-indicator hidden">Offline - Using
                    cached content</div>
            </div>
            <div>
                <div class="btn-bar">
                    <span id="welcome-message"></span>
                    <button id="btn-login" class="btn rounded">Login</button>
                    <button id="btn-logout" class="btn rounded hidden">Logout</button>
                    <button id="btn-install" class="btn rounded hidden">Install App</button>
                </div>
                <div class="font-size-buttons hidden">
                    Font Size
                    <button id="font-" class="btn">-</button>
                    <button id="font+" class="btn">+</button>
                </div>
            </div>
        </header>

        <main>
            <section class="panel login-panel hidden">
                <form id="login-form">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" name="username" id="username" required>
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" id="password" required>
                    <button type="submit" class="btn rounded">Login</button>
                    <button id="login-cancel" class="btn rounded">Cancel</button>
                    <div class="error"></div>
                </form>
            </section>

            <section class="panel song-list-panel">
                <div class="search-wrapper">
                    <div class="search-container">
                        <input type="text" id="search-input" placeholder="Search songs..." class="search-input">
                        <span id="item-counter" class="item-counter">0</span>
                    </div>
                    <button id="btn-add" class="btn rounded hidden">Add song</button>
                </div>
                <div id="songList" class="song-list"></div>
            </section>

            <section class="panel song-view-panel hidden">
                <div class="song-header">
                    <div class="song-header-topbar">
                        <p id="songArtist" class="song-artist">Artist</p>
                        <button id="btn-edit" class="edit-btn hidden" type="button">
                            Edit song
                        </button>
                    </div>
                    <h2 id="songTitle">Select a song</h2>
                </div>

                <div id="songContent" class="song-content"></div>
            </section>
        </main>
    </div>

    <div id="song-modal" class="modal hidden">
        <div class="modal-content">
            <form id="song-form">
                <label for="song-title">Title:</label>
                <input type="text" id="song-title" required>
                <label for="song-artist">Artist:</label>
                <input type="text" id="song-artist" required>
                <label for="song-content-input">Content (ChordPro format):</label>
                <textarea id="song-content-input" rows="20"
                    placeholder="[G]When you were here before [B]couldn't look you in the eye"></textarea>
                <button type="submit" class="btn rounded">Add Song</button>
                <button type="button" class="btn rounded" id="btn-cancel">Cancel</button>
            </form>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>


    <div class="footer">
        <div class="sidebar hidden">
            <div id="chord-svg" class="hidden"></div>
            <div class="chord-buttons hidden">
                <button id="chord-prev">&lt;</button>
                <button id="chord-close">close</button>
                <button id="chord-next">&gt;</button>
            </div>
            <div class="autoscroll-speed">
                Speed&nbsp;<span id="scroll-speed">0</span>
                <button id="scroll-">-</button>
                <button id="scroll+">+</button>
            </div>
            <button id="scroll-start">Start autoplay</button>
        </div>
    </div>
</body>

</html>
