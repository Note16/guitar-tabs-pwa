<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f2f2f8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f0f14" media="(prefers-color-scheme: dark)">
    <meta name="description" content="A mobile-first PWA for reading guitar song tabs">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/icon.png">
    <title>Guitar Tabs</title>
</head>

<body>
    <div class="app-shell">
        <header class="topbar">
            <div>
                <h1>
                    <a href="/">Guitar Tabs</a>
                </h1>
                <div id="offline-indicator" class="offline-indicator hidden">Offline - Using
                    cached content</div>
            </div>
            <div>
                <div class="btn-bar">
                    <button id="btn-install" class="button-secondary hidden">Install App</button>
                    <button id="btn-add" class="button-secondary">Add song</button>
                </div>
                <div class="font-size-buttons hidden">
                    <button id="font-" class="button-secondary">-</button>
                    <button id="font+" class="button-secondary">+</button>
                </div>
            </div>
        </header>

        <main>
            <section class="panel song-list-panel">
                <input type="text" id="search-input" placeholder="Search songs..." class="search-input">
                <div id="songList" class="song-list"></div>
            </section>

            <section class="panel song-view-panel hidden">
                <div class="song-header">
                    <div class="song-header-topbar">
                        <p id="songArtist" class="song-artist">Artist</p>
                        <button id="btn-edit" class="edit-btn" type="button">
                            Edit song
                        </button>
                    </div>
                    <h2 id="songTitle">Select a song</h2>
                </div>

                <div id="songContent" class="song-content">
                    <p class="placeholder">Choose a song from the list to view chords and lyrics.</p>
                </div>
            </section>
        </main>
    </div>

    <div id="song-modal" class="modal hidden">
        <div class="modal-content">
            <h3>Add New Song</h3>
            <form id="song-form">
                <label for="song-title">Title:</label>
                <input type="text" id="song-title" required>
                <label for="song-artist">Artist:</label>
                <input type="text" id="song-artist" required>
                <label for="song-content-input">Content (ChordPro format):</label>
                <textarea id="song-content-input" rows="10"
                    placeholder="[G]When you were here before [B]couldn't look you in the eye"></textarea>
                <button type="submit">Add Song</button>
                <button type="button" id="btn-cancel">Cancel</button>
            </form>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>


    <div class="footer">
        <div class="autoscroll hidden">
            <span id="scroll-speed">0</span>
            <button id="scroll-">-</button>
            <button id="scroll+">+</button>
            <button id="scroll-start">Start</button>
        </div>
    </div>
</body>

</html>
